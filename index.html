<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comet Simulation</title>
  <link rel="stylesheet" href="./css/main.css" />
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-color: black;
    }

    #renderCanvas{
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
    }

    #uiOverlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-family: sans-serif;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
      box-sizing: border-box;
    }

    #uiOverlay {
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    #uiOverlay label {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.85;
    }

    #uiOverlay input[type="range"],
    #uiOverlay input[type="number"],
    #uiOverlay input[type="text"],
    #uiOverlay select {
      width: 100%;
      margin-bottom: 4px;
      box-sizing: border-box;
    }

    details.ui-group {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
    }

    details.ui-group summary {
      cursor: pointer;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.07);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    details.ui-group summary::-webkit-details-marker { display: none; }

    details.ui-group summary::after {
      content: '▶';
      font-size: 9px;
      opacity: 0.6;
      transition: transform 0.2s;
    }

    details.ui-group[open] summary::after {
      transform: rotate(90deg);
    }

    details.ui-group .group-content {
      padding: 8px 10px 4px 10px;
    }

    details.ui-group .group-content button {
      margin-top: 6px;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 14px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #666;
    }

    .comet-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .comet-buttons button {
      width: auto;
      font-size: 12px;
      padding: 4px 8px;
    }

    #homeScreen{
      padding-top: calc(20px + var(--safe-top)) !important;
      padding-left: calc(20px + var(--safe-left)) !important;
      padding-right: calc(20px + var(--safe-right)) !important;
      height: 100dvh !important;
      box-sizing: border-box;
    }

    #simTimeDisplay{
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      z-index: 1000;
      font-family: sans-serif;
      text-shadow: 0 0 5px black;
    }


    #observerReticle {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: none;
      font-family: sans-serif;
    }

    #observerReticle.active { display: block; }

    #observerReticle::before,
    #observerReticle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,255,255,0.45);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    #observerReticle::before { width: 42px; height: 1px; }
    #observerReticle::after { width: 1px; height: 42px; }

    #observerFrame {
      position: absolute;
      inset: 7%;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.0), inset 0 0 18px rgba(255,255,255,0.06);
    }

    #observerStatus {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      z-index: 1001;
      color: #eee;
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: sans-serif;
      max-width: min(90vw, 760px);
      text-align: center;
      display: none;
      pointer-events: none;
    }

    #observerStatus.active { display: block; }

    #observerInfo {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(255,255,255,0.82);
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px;
      white-space: pre-line;
    }

    #mobileSpeedBar{
      display: none;
    }

    #timelineWrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      font-family: sans-serif;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-sizing: border-box;
    }

    #topRow {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 15px;
      padding-left: 10px;
    }

    #timelineLabel {
      font-weight: bold;
      color: white;
      font-size: 1.2em;
    }

    #timelineSlider {
      width: 95%;
      cursor: pointer;
    }

    #uiOverlay input,
    #uiOverlay select {
      width: 100%;
      box-sizing: border-box;
    }

    #cometButtons button {
      background-color: #444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    #cometButtons button:hover {
      background-color: #666;
    }

    #mobileMenuBar,
    #mobileDrawer,
    #mobileDrawerBackdrop {
      display: none;
    }

    @media (max-width: 900px){
      html, body{
        overflow: hidden;
        height: 100%;
        background: #000;
      }

      #simTimeDisplay{
        top: calc(8px + var(--safe-top)) !important;
        font-size: 18px !important;
      }

      #speedControl{
        display: none;
      }

      /* Speed on main screen */
      #mobileSpeedBar{
        display: block;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px 20px calc(10px + var(--safe-bottom)) 20px;
        font-family: sans-serif;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-sizing: border-box;
      }

      #mobileSpeedBar label{
        display: block;
        font-weight: bold;
        color: white;
        font-size: 1.2em;
        padding-left: 10px;
        margin-bottom: 0;
      }

      #velocitySliderMobile{
        width: 95%;
        cursor: pointer;
        margin: 0;
        box-sizing: border-box;
      }

      /* Hide date control from main screen on mobile */
      #timelineWrapper{
        display: none !important;
      }

      #mobileMenuBar{
        display: flex;
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(84px + var(--safe-bottom));
        z-index: 3000;
        gap: 8px;
        padding: 8px;
        background: rgba(10, 10, 16, 0.88);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        box-sizing: border-box;
      }

      #mobileMenuBar button{
        flex: 1;
        margin: 0;
        padding: 10px 8px;
        font-size: 14px;
        background: #1d3557;
        color: white;
        border: none;
        border-radius: 10px;
        width: auto;
      }

      #mobileDrawerBackdrop{
        display: block;
        position: fixed;
        inset: 0;
        z-index: 2998;
        background: rgba(0,0,0,0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #mobileDrawerBackdrop.open{
        opacity: 1;
        pointer-events: auto;
      }

      #mobileDrawer{
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2999;
        max-height: 78dvh;
        background: rgba(8, 12, 18, 0.96);
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
        border-top: 1px solid rgba(255,255,255,0.18);
        transform: translateY(100%);
        transition: transform 0.25s ease;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      #mobileDrawer.open{
        transform: translateY(0);
      }

      #mobileDrawerHandle{
        width: 46px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255,255,255,0.35);
        margin: 10px auto 8px auto;
      }

      #mobileDrawerHeader{
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 10px 14px;
        color: white;
        font-family: sans-serif;
      }

      #mobileDrawerHeader button{
        width: auto;
        margin: 0;
        padding: 6px 10px;
        font-size: 16px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
      }

      .mobilePanel{
        display: none;
        overflow: auto;
        max-height: calc(78dvh - 56px);
        padding: 0 12px calc(18px + var(--safe-bottom)) 12px;
        color: white;
        font-family: sans-serif;
        box-sizing: border-box;
      }

      .mobilePanel.active{
        display: block;
      }

      .mobileSection{
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .mobileSection h3{
        margin: 0 0 10px 0;
        font-size: 15px;
      }

      #betaCurveCanvas{
        width: 100% !important;
        max-width: 100%;
        height: auto !important;
      }

      #mobileMenuBar{
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      #mobileMenuBar.hidden{
        opacity: 0;
        pointer-events: none;
        transform: translateY(20px);
      }
    }

    @media (max-width: 480px){
      .comet-buttons{ grid-template-columns: 1fr; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="homeScreen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000814;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: white;
    font-family: Arial, sans-serif;
  ">
    <h1 style="font-size: 64px; margin: 0;">Comet Simulator</h1>
    <button id="startBtn" style="
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 24px;
      background-color: #1d3557;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: auto;
    ">Click to start</button>

    <div id="loadingSpinner" style="
      margin-top: 30px;
      border: 6px solid #ccc;
      border-top: 6px solid #1d3557;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      display: none;
    "></div>
  </div>

  <canvas id="renderCanvas"></canvas>
  <div id="observerReticle"><div id="observerFrame"></div></div>
  <div id="observerStatus"></div>

  <div id="simTimeDisplay">
    Time: --
  </div>

  <div id="mobileSpeedBar">
    <label for="velocitySliderMobile">
      Speed: <span id="velocityValueMobile">1</span>×
    </label>
    <input type="range" id="velocitySliderMobile" min="0" max="93" value="0" step="1">
  </div>

  <div id="timelineWrapper">
    <div id="topRow" style="position:relative;justify-content:center;min-height:27px;">
      <div id="timelineLabel" style="position:absolute;left:10px;">Date: 2000-01-01</div>
      <div id="diagnosticsBar" style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        max-width: calc(100% - 220px);
        font-family: monospace, sans-serif;
        pointer-events: none;
      ">
        <div id="actBoxQ" style="font-size:14px;color:#fff;background:rgba(0,0,0,0.72);padding:4px 8px;border-radius:4px;border:1px solid #fff;white-space:nowrap;">Q: --</div>
        <div id="actBoxDecay" style="font-size:14px;color:#fff;background:rgba(0,0,0,0.72);padding:4px 8px;border-radius:4px;border:1px solid #fff;white-space:nowrap;">decay: --</div>
        <div id="particleCounter" style="font-size:14px;color:#fff;background:rgba(0,0,0,0.72);padding:4px 8px;border-radius:4px;border:1px solid #fff;white-space:nowrap;">Particles: --</div>
        <div id="fpsCounter" style="font-size:14px;color:#fff;background:rgba(0,0,0,0.72);padding:4px 8px;border-radius:4px;border:1px solid #fff;white-space:nowrap;">FPS: --</div>
      </div>
    </div>
    <input type="range" id="timelineSlider" min="-36525" max="36525" value="0" step="1" disabled />
  </div>

  <div id="simulationStatusAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="uiOverlay">

    <!-- Orbit -->
    <details class="ui-group" open>
      <summary>Orbit</summary>
      <div class="group-content">
        <label for="eccentricityInput">Eccentricity (e)</label>
        <input type="number" id="eccentricityInput" step="0.0001" min="0" max="10" value="0.64090813" />

        <label for="perihelionInput">Perihelion Distance (AU)</label>
        <input type="number" id="perihelionInput" step="0.0001" min="0.1" value="1.24326564" />

        <label for="inclinationInput">Inclination (°)</label>
        <input type="number" id="inclinationInput" step="0.01" value="7.04029491" />

        <label for="longitudeAscendingNodeInput">Longitude of Ascending Node (Ω °)</label>
        <input type="number" id="longitudeAscendingNodeInput" step="0.01" value="50.135573804414" />

        <label for="argumentPerihelionInput">Argument of Perihelion (ω °)</label>
        <input type="number" id="argumentPerihelionInput" step="0.01" value="12.798249734157" />

        <label for="perihelionDateInput">Perihelion Date (JD)</label>
        <input type="number" id="perihelionDateInput" step="0.1" value="2457247.5887" />
      </div>
    </details>

    <!-- Dust & Activity -->
    <details class="ui-group" open>
      <summary>Dust &amp; Activity</summary>
      <div class="group-content">
        <label for="particleCountInput">Particle count (per sim-day @ 1 AU)</label>
        <input type="number" id="particleCountInput" step="1" min="1" max="100000" value="500" />

        <label for="particleLifetimeInput">Particle lifetime (days)</label>
        <input type="number" id="particleLifetimeInput" step="1" min="1" value="250" />

        <label for="activityExponentInput">Activity exponent n (Q = k / r^n)</label>
        <input id="activityExponentInput" type="number" step="0.1" min="0" max="6" value="2">

        <label for="activityScaleInput">Activity scale k (at 1 AU)</label>
        <input id="activityScaleInput" type="number" step="0.1" min="0" value="1">

        <label for="activityHalfLifeInput">Activity decay half-life (e-days)</label>
        <input id="activityHalfLifeInput" type="number" step="10" min="1" value="1500">
      </div>
    </details>

    <!-- Velocity -->
    <details class="ui-group">
      <summary>Velocity</summary>
      <div class="group-content">
        <label for="ejectionSpeedInput">Base ejection speed V₀ (m/s)</label>
        <input type="number" id="ejectionSpeedInput" step="50" min="0" max="5000" value="500" />

        <label for="ejectionGammaInput">β exponent γ — v ∝ β^γ</label>
        <input type="number" id="ejectionGammaInput" step="0.05" min="0" max="1" value="0.5" />

        <label for="ejectionKappaInput">Distance exponent κ — v ∝ r_h^κ</label>
        <input type="number" id="ejectionKappaInput" step="0.05" min="-2" max="0" value="-0.5" />

        <label for="ejectionExpcosInput">Sunward cone sharpness (expocos)</label>
        <input type="number" id="ejectionExpcosInput" step="0.1" min="0" max="5" value="1" />
      </div>
    </details>

    <!-- Visualization -->
    <details class="ui-group">
      <summary>Visualization</summary>
      <div class="group-content">
        <label for="visModeSelect">Particle colour</label>
        <select id="visModeSelect">
          <option value="none">None (white)</option>
          <option value="beta">β value</option>
          <option value="age">Age</option>
          <option value="dist">Distance from nucleus</option>
          <option value="vrel">Relative velocity</option>
        </select>
      </div>
    </details>

    <!-- Camera -->
    <details class="ui-group">
      <summary>Camera</summary>
      <div class="group-content">

        <button id="toggleFocusBtn">Focus on Comet</button>
        <button id="updateViewBtn" disabled>Update Position</button>

        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.16);margin:10px 0;">
        <label for="observerPresetSelect">Space telescope preset</label>
        <select id="observerPresetSelect">
          <option value="manual" selected>Manual / no preset</option>
          <option value="hubble">Hubble Space Telescope — LEO approx.</option>
          <option value="jwst">JWST — Sun–Earth L2 approx.</option>
          <option value="neowise">NEOWISE / WISE — historical SSO approx.</option>
          <option value="soho">SOHO — Sun–Earth L1 approx.</option>
          <option value="stereoA">STEREO-A — heliocentric approx.</option>
        </select>

        <label for="observerModeSelect">Manual observer position</label>
        <select id="observerModeSelect">
          <option value="earth" selected>Earth (geocentric)</option>
          <option value="j2000">Custom J2000 position</option>
        </select>

        <label for="observerXYZInput">Custom position (x, y, z)</label>
        <input type="text" id="observerXYZInput" value="1, 1, 1" placeholder="e.g. 1, 0, 0.2" />

        <label for="observerUnitSelect">Custom position units</label>
        <select id="observerUnitSelect">
          <option value="AU" selected>AU</option>
          <option value="km">kilometers</option>
          <option value="m">meters</option>
        </select>

        <label for="observerTargetSelect">Target direction</label>
        <select id="observerTargetSelect">
          <option value="comet" selected>Comet nucleus</option>
          <option value="radec">Manual RA / Dec</option>
        </select>

        <label for="observerRaInput">RA (degrees, manual target)</label>
        <input type="number" id="observerRaInput" min="0" max="360" step="0.0001" value="0" />

        <label for="observerDecInput">Dec (degrees, manual target)</label>
        <input type="number" id="observerDecInput" min="-90" max="90" step="0.0001" value="0" />

        <label for="observerFovInput">Vertical FOV (degrees)</label>
        <input type="number" id="observerFovInput" min="0.01" max="120" step="0.01" value="5" />

        <label for="observerRollInput">Camera roll (degrees)</label>
        <input type="number" id="observerRollInput" min="-180" max="180" step="0.1" value="0" />

        <button id="applyObserverViewBtn">Apply telescope view</button>
        <button id="exitObserverViewBtn">Exit telescope view</button>
        <button id="copyObserverMetadataBtn">Copy view metadata</button>
        <button id="saveObserverScreenshotBtn">Save screenshot</button>

        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.16);margin:10px 0;">
        <label for="betaSizeDensityInput">β → size density (kg/m³)</label>
        <input type="number" id="betaSizeDensityInput" min="100" max="5000" step="50" value="1000" />

        <label for="betaSizeQprInput">β → size Qpr</label>
        <input type="number" id="betaSizeQprInput" min="0.01" max="5" step="0.05" value="1" />

        <label for="betaSizeMagnifierInput">Visible angular-size multiplier</label>
        <input type="number" id="betaSizeMagnifierInput" min="1" max="1e18" step="1e12" value="1e13" />

        <label for="betaSizeMinPxInput">Minimum visible radius (px)</label>
        <input type="number" id="betaSizeMinPxInput" min="0" max="20" step="0.1" value="0.2" />

        <label for="betaSizeMaxPxInput">Maximum rendered radius (px)</label>
        <input type="number" id="betaSizeMaxPxInput" min="1" max="500" step="1" value="35" />

        <button id="exportBetaSizedTelescopeImageBtn">Export β-size telescope image</button>
        <div id="observerInfo">Telescope view is not active.</div>
      </div>
    </details>

    <!-- Analysis -->
    <details class="ui-group">
      <summary>Analysis</summary>
      <div class="group-content">
        <label for="synchroneDaysInput">Synchrone emission times (d)</label>
        <input id="synchroneDaysInput" value="-120,-60,-30,-10" />

        <label for="synchroneBetasInput">β values (0–1)</label>
        <input id="synchroneBetasInput" value="0.01,0.05,0.1,0.3,0.7" />

        <button id="generateSyndynesBtn">Generate syndynes</button>
        <button id="generateSynchronesBtn">Generate synchrones</button>
        <button id="exportSynSydCSVBtn">Export syn/synd CSV (RA/Dec)</button>

        <label for="densityGridNInput">Density grid resolution (N³)</label>
        <select id="densityGridNInput">
          <option value="32">32³ — 131k voxels</option>
          <option value="64" selected>64³ — 262k voxels</option>
          <option value="128">128³ — 2M voxels</option>
          <option value="256">256³ — 16M voxels</option>
        </select>
        <label for="densityMaxAgeInput">Max particle age for export (days, 0 = all)</label>
        <input id="densityMaxAgeInput" type="number" value="50" min="0" max="500" step="5" style="width:60px">
        <label for="densityMaxRadInput">Max distance from nucleus (km, 0 = all)</label>
        <input id="densityMaxRadInput" type="number" value="2000000" min="0" max="50000000" step="100000" style="width:90px">
        <label for="densityClipLoInput">Bound clip low % (outlier trim)</label>
        <input id="densityClipLoInput" type="number" value="1" min="0" max="10" step="0.5" style="width:60px">
        <label for="densityClipHiInput">Bound clip high %</label>
        <input id="densityClipHiInput" type="number" value="99" min="90" max="100" step="0.5" style="width:60px">

  <script>
    (function setupMobileUI() {
      const isMobile = window.matchMedia("(max-width: 900px)").matches;
      if (!isMobile) return;

      const menuBar = document.getElementById("mobileMenuBar");
      const drawer = document.getElementById("mobileDrawer");
      const backdrop = document.getElementById("mobileDrawerBackdrop");
      const closeBtn = document.getElementById("mobileDrawerClose");
      const titleEl = document.getElementById("mobileDrawerTitle");

      const controlsPanel = document.getElementById("controlsPanel");
      const viewPanel = document.getElementById("viewPanel");
      const cometsPanel = document.getElementById("cometsPanel");
      const infoPanel = document.getElementById("infoPanel");

      const uiOverlay = document.getElementById("uiOverlay");
      const cometButtons = document.getElementById("cometButtons");
      const pauseContainer = document.getElementById("pauseContainer");
      const statusContainer = document.getElementById("statusContainer");
      const betaCurvePanel = document.getElementById("betaCurvePanel");
      const actBoxQ = document.getElementById("actBoxQ");
      const actBoxDecay = document.getElementById("actBoxDecay");
      const particleCounter = document.getElementById("particleCounter");
      const fpsCounter = document.getElementById("fpsCounter");
      const timelineWrapper = document.getElementById("timelineWrapper");

      const velocitySlider = document.getElementById("velocitySlider");
      const velocitySliderMobile = document.getElementById("velocitySliderMobile");

      function syncSpeedUI(value) {
        if (velocitySlider) velocitySlider.value = value;
        if (velocitySliderMobile) velocitySliderMobile.value = value;
      }

      if (velocitySlider && velocitySliderMobile) {
        syncSpeedUI(velocitySlider.value);

        velocitySliderMobile.addEventListener("input", () => {
          velocitySlider.value = velocitySliderMobile.value;
          syncSpeedUI(velocitySliderMobile.value);
          velocitySlider.dispatchEvent(new Event("input", { bubbles: true }));
        });

        velocitySlider.addEventListener("input", () => {
          syncSpeedUI(velocitySlider.value);
        });
      }

      function wrapSection(title, el) {
        const section = document.createElement("div");
        section.className = "mobileSection";

        const h = document.createElement("h3");
        h.textContent = title;
        section.appendChild(h);

        section.appendChild(el);
        return section;
      }

      function resetMovedStyles(el) {
        el.style.position = "static";
        el.style.top = "";
        el.style.right = "";
        el.style.bottom = "";
        el.style.left = "";
        el.style.width = "100%";
        el.style.maxWidth = "none";
        el.style.maxHeight = "none";
        el.style.background = "transparent";
        el.style.backdropFilter = "none";
        el.style.padding = "0";
        el.style.margin = "0";
        el.style.boxShadow = "none";
        el.style.border = "none";
      }

      controlsPanel.innerHTML = "";
      viewPanel.innerHTML = "";
      cometsPanel.innerHTML = "";
      infoPanel.innerHTML = "";

      controlsPanel.appendChild(wrapSection("Simulation", uiOverlay));
      controlsPanel.appendChild(wrapSection("Date", timelineWrapper));

      viewPanel.appendChild(wrapSection("Pause", pauseContainer));
      viewPanel.appendChild(wrapSection("Status", statusContainer));
      viewPanel.appendChild(wrapSection("Beta curve", betaCurvePanel));

      infoPanel.appendChild(wrapSection("Activity Q", actBoxQ));
      infoPanel.appendChild(wrapSection("Decay", actBoxDecay));
      infoPanel.appendChild(wrapSection("Particles", particleCounter));
      infoPanel.appendChild(wrapSection("FPS", fpsCounter));

      cometsPanel.appendChild(wrapSection("Comets", cometButtons));

      [
        uiOverlay,
        cometButtons,
        pauseContainer,
        statusContainer,
        betaCurvePanel,
        actBoxQ,
        actBoxDecay,
        particleCounter,
        fpsCounter,
        timelineWrapper
      ].forEach(resetMovedStyles);

      cometButtons.style.display = "flex";
      cometButtons.style.flexDirection = "column";
      cometButtons.style.gap = "6px";

      const panels = {
        controlsPanel: { el: controlsPanel, title: "Controls" },
        viewPanel: { el: viewPanel, title: "View" },
        cometsPanel: { el: cometsPanel, title: "Comets" },
        infoPanel: { el: infoPanel, title: "Info" }
      };

      function closeDrawer() {
        drawer.classList.remove("open");
        backdrop.classList.remove("open");
        menuBar.classList.remove("hidden");
        Object.values(panels).forEach(p => p.el.classList.remove("active"));
      }

      function openPanel(panelId) {
        Object.values(panels).forEach(p => p.el.classList.remove("active"));

        const panel = panels[panelId];
        if (!panel) return;

        panel.el.classList.add("active");
        titleEl.textContent = panel.title;

        drawer.classList.add("open");
        backdrop.classList.add("open");
        menuBar.classList.add("hidden");
      }

      menuBar.querySelectorAll("button[data-panel]").forEach(btn => {
        btn.addEventListener("click", () => openPanel(btn.dataset.panel));
      });

      closeBtn.addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
    })();
  </script>
