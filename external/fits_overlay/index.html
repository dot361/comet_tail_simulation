<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FITS overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>FITS overlay</h1>
    <button id="exportBtn" type="button" disabled>Save PNG</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>Files</h2>
        <label class="file-row">
          <span>Observed FITS</span>
          <input id="realFile" type="file" accept=".fits,.fit,.fts,application/fits" />
        </label>
        <pre id="realInfo" class="file-info">No file loaded.</pre>

        <label class="file-row">
          <span>Simulated FITS</span>
          <input id="simFile" type="file" accept=".fits,.fit,.fts,application/fits" />
        </label>
        <pre id="simInfo" class="file-info">No file loaded.</pre>
      </section>

      <section class="panel">
        <h2>Display</h2>
        <label><span>Mode</span>
          <select id="displayMode">
            <option value="overlay" selected>Overlay</option>
            <option value="observed">Observed only</option>
            <option value="simulation">Simulated only</option>
          </select>
        </label>
        <div id="wcsState" class="note">Load both FITS files.</div>
      </section>

      <section class="panel">
        <h2>Nucleus alignment</h2>
        <div class="button-row">
          <button id="pickObservedNucleusBtn" type="button">Pick observed nucleus</button>
          <button id="pickSimulatedNucleusBtn" type="button">Pick simulated nucleus</button>
          <button id="clearNucleusBtn" type="button">Clear points</button>
        </div>
        <label class="check-row"><input id="alignNuclei" type="checkbox" checked /> Align simulated nucleus</label>
        <pre id="nucleusInfo" class="file-info">Pick both nucleus points.</pre>
      </section>
    </aside>

    <section class="viewer-area">
      <div class="viewer-toolbar">
        <span id="status">Load observed and simulated FITS files.</span>
        <span id="canvasInfo"></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="overlayCanvas" width="1000" height="800"></canvas>
        <div id="emptyState" class="empty-state">Load observed and simulated FITS files.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
